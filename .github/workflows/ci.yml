name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Valores dummy, sin secretos reales. La app nunca abre una conexion real
  # durante build/test: las paginas del dashboard son todas dinamicas (se
  # ejecutan en request-time, no en build-time) y los tests unitarios de
  # este bloque no tocan Prisma ni Supabase. Verificado localmente: el build
  # completo pasa con estas mismas variables, sin una base de datos real
  # disponible.
  DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db?schema=aceros"
  DIRECT_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db?schema=aceros"
  AUTH_SECRET: "ci_dummy_auth_secret_at_least_32_characters_long"
  AUTH_URL: "http://localhost:3000"
  AUTH_TRUST_HOST: "true"

jobs:
  ci:
    name: Lint, validate, test y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate

      - name: Validar schema de Prisma
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm run test

      - name: Build
        run: npm run build
